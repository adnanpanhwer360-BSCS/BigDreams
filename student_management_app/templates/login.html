{% extends 'base.html' %}
{% load static %} 

{% block content %}

<style>
    /* ---------- Scene (full screen, independent of the base template) ---------- */
    body.login-page {
        margin: 0;
        font-family: "Segoe UI", "Source Sans Pro", Roboto, Arial, sans-serif;
        background: #070b1f;
    }

    .lg-scene {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: auto;
        background: linear-gradient(120deg, #070b1f, #101a4a, #1b1160, #0a2a5e, #070b1f);
        background-size: 400% 400%;
        animation: lgShift 22s ease infinite;
    }

    @keyframes lgShift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Soft glowing orbs floating in the background */
    .lg-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.55;
        pointer-events: none;
        animation: lgFloat 16s ease-in-out infinite;
    }

    .lg-orb.o1 { width: 360px; height: 360px; background: #3b6cff; top: -90px; left: -80px; }
    .lg-orb.o2 { width: 320px; height: 320px; background: #8a4dff; bottom: -100px; right: -60px; animation-delay: -6s; }
    .lg-orb.o3 { width: 240px; height: 240px; background: #00c2ff; top: 55%; left: 58%; animation-delay: -11s; opacity: 0.35; }

    @keyframes lgFloat {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33%      { transform: translate(40px, -30px) scale(1.08); }
        66%      { transform: translate(-30px, 35px) scale(0.95); }
    }

    /* Small twinkling stars (created by the script below) */
    .lg-twinkle {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        pointer-events: none;
        animation: lgTwinkle 3s ease-in-out infinite;
    }

    @keyframes lgTwinkle {
        0%, 100% { opacity: 0.15; transform: scale(0.8); }
        50%      { opacity: 1; transform: scale(1.25); }
    }

    /* Canvas for the falling stars that follow the mouse */
    #lgStars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
    }

    /* ---------- Card ---------- */
    .lg-tilt {
        position: relative;
        width: 100%;
        max-width: 420px;
        perspective: 900px;
        transition: transform 0.25s ease-out;
        transform-style: preserve-3d;
    }

    .lg-card {
        position: relative;
        padding: 40px 36px 34px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
        color: #fff;
        animation: lgEnter 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    @keyframes lgEnter {
        from { opacity: 0; transform: translateY(40px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Glowing edge that slowly moves around the card */
    .lg-card::before {
        content: "";
        position: absolute;
        top: -1px;
        right: -1px;
        bottom: -1px;
        left: -1px;
        border-radius: 24px;
        padding: 1px;
        background: linear-gradient(135deg, rgba(120, 170, 255, 0.9), rgba(160, 90, 255, 0), rgba(0, 210, 255, 0.8));
        background-size: 200% 200%;
        animation: lgEdge 6s linear infinite;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }

    @keyframes lgEdge {
        0%   { background-position: 0% 0%; }
        100% { background-position: 200% 200%; }
    }

    .lg-head {
        text-align: center;
        margin-bottom: 30px;
    }

    .lg-logo {
        position: relative;
        width: 74px;
        height: 74px;
        margin: 0 auto 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        color: #fff;
        background: linear-gradient(135deg, #3b6cff, #8a4dff);
        box-shadow: 0 10px 30px rgba(80, 100, 255, 0.55);
    }

    .lg-logo::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        border-radius: 50%;
        border: 2px solid rgba(140, 160, 255, 0.7);
        animation: lgPulse 2.4s ease-out infinite;
    }

    @keyframes lgPulse {
        0%   { transform: scale(1); opacity: 0.9; }
        100% { transform: scale(1.7); opacity: 0; }
    }

    .lg-head h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.3px;
    }

    /* ---------- Fields with floating labels ---------- */
    .lg-field {
        position: relative;
        margin-bottom: 20px;
    }

    .lg-field input {
        width: 100%;
        height: 54px;
        padding: 18px 46px 0 48px;
        font-size: 15px;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
        border: 1.5px solid rgba(255, 255, 255, 0.18);
        border-radius: 14px;
        outline: none;
        transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .lg-field input:focus {
        border-color: #6f9bff;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 0 4px rgba(111, 155, 255, 0.2);
    }

    .lg-field label {
        position: absolute;
        left: 48px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.65);
        font-size: 15px;
        pointer-events: none;
        transform-origin: left center;
        transition: all 0.2s ease;
    }

    /* Label moves up when the box is focused or has text */
    .lg-field input:focus + label,
    .lg-field input:not(:placeholder-shown) + label {
        top: 14px;
        transform: translateY(0) scale(0.78);
        color: #9fbcff;
    }

    .lg-field .lg-icon {
        position: absolute;
        left: 17px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.55);
        transition: color 0.25s ease, transform 0.25s ease;
        pointer-events: none;
    }

    .lg-field:focus-within .lg-icon {
        color: #9fbcff;
        transform: translateY(-50%) scale(1.15);
    }

    /* Keep the dark glass look when the browser auto-fills the box */
    .lg-field input:-webkit-autofill,
    .lg-field input:-webkit-autofill:focus {
        -webkit-text-fill-color: #fff;
        -webkit-box-shadow: 0 0 0 1000px #1a2358 inset;
        caret-color: #fff;
        transition: background-color 9999s ease-out 0s;
    }

    .lg-toggle {
        position: absolute;
        right: 7px;
        top: 50%;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .lg-toggle:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
    }

    .lg-caps {
        display: none;
        font-size: 12.5px;
        color: #ffd37a;
        margin: -8px 0 14px 4px;
    }

    /* ---------- Button ---------- */
    .lg-btn {
        position: relative;
        width: 100%;
        height: 54px;
        border: 0;
        border-radius: 14px;
        overflow: hidden;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.4px;
        cursor: pointer;
        background: linear-gradient(135deg, #3b6cff, #8a4dff);
        box-shadow: 0 12px 28px rgba(80, 100, 255, 0.45);
        transition: transform 0.2s ease, box-shadow 0.25s ease, opacity 0.2s ease;
    }

    /* Light sweep across the button on hover */
    .lg-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -80%;
        width: 60%;
        height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        transform: skewX(-20deg);
        transition: left 0.6s ease;
    }

    .lg-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 18px 36px rgba(80, 100, 255, 0.55);
    }

    .lg-btn:hover:not(:disabled)::before {
        left: 130%;
    }

    .lg-btn:active:not(:disabled) {
        transform: translateY(0) scale(0.98);
    }

    .lg-btn:disabled {
        opacity: 0.8;
        cursor: not-allowed;
    }

    .lg-ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
        transform: scale(0);
        animation: lgRipple 0.6s ease-out forwards;
        pointer-events: none;
    }

    @keyframes lgRipple {
        to { transform: scale(4); opacity: 0; }
    }

    /* ---------- Error message ---------- */
    .lg-error {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 20px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 14px;
        color: #ffd9d6;
        background: rgba(255, 80, 70, 0.16);
        border: 1px solid rgba(255, 110, 100, 0.45);
        animation: lgShake 0.45s ease;
    }

    @keyframes lgShake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(7px); }
        60% { transform: translateX(-5px); }
        80% { transform: translateX(4px); }
    }

    @media (max-width: 480px) {
        .lg-card { padding: 32px 22px 28px; border-radius: 20px; }
        .lg-head h2 { font-size: 21px; }
    }

    /* People who prefer less motion get a calm page */
    @media (prefers-reduced-motion: reduce) {
        .lg-scene, .lg-orb, .lg-twinkle, .lg-card, .lg-card::before, .lg-logo::after {
            animation: none;
        }
    }
</style>

    <body class="hold-transition login-page">

<canvas id="lgStars"></canvas>

<div class="lg-scene" id="lgScene">

  <div class="lg-orb o1"></div>
  <div class="lg-orb o2"></div>
  <div class="lg-orb o3"></div>

  <div class="lg-tilt" id="lgTilt">
    <div class="lg-card">

      <div class="lg-head">
        <div class="lg-logo"><i class="fas fa-graduation-cap"></i></div>
        <h2>Student Management System</h2>
      </div>

      {% if messages %}
        {% for message in messages %}
          {% if message.tags == "error" %}
            <div class="lg-error">
              <i class="fas fa-exclamation-circle mt-1"></i>
              <span>{{ message }}</span>
            </div>
          {% endif %}
        {% endfor %}
      {% endif %}

      <form action="{% url 'doLogin' %}" method="POST" id="loginForm">
      {% csrf_token %}
      <input type="hidden" name="login_role" value="{{ login_role }}">

        <div class="lg-field">
          <input type="email" name="email" id="loginEmail" placeholder=" " autocomplete="username" required>
          <label for="loginEmail">Email address</label>
          <i class="fas fa-envelope lg-icon"></i>
        </div>

        <div class="lg-field">
          <input type="password" name="password" id="loginPassword" placeholder=" " autocomplete="current-password" required>
          <label for="loginPassword">Password</label>
          <i class="fas fa-lock lg-icon"></i>
          <button type="button" class="lg-toggle" id="lgToggle" title="Show or hide password">
            <i class="fas fa-eye" id="lgToggleIcon"></i>
          </button>
        </div>

        <div class="lg-caps" id="lgCaps">
          <i class="fas fa-exclamation-triangle"></i> Caps Lock is on
        </div>

        <button type="submit" class="lg-btn" id="lgButton">Sign In</button>
      </form>

    </div>
  </div>

</div>

<script>
  (function () {
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ---------- Twinkling background stars ---------- */
    var scene = document.getElementById("lgScene");
    for (var i = 0; i < 70; i++) {
      var dot = document.createElement("div");
      dot.className = "lg-twinkle";
      var size = Math.random() * 2.4 + 1;
      dot.style.width = size + "px";
      dot.style.height = size + "px";
      dot.style.left = Math.random() * 100 + "%";
      dot.style.top = Math.random() * 100 + "%";
      dot.style.animationDelay = (Math.random() * 4).toFixed(2) + "s";
      dot.style.animationDuration = (2 + Math.random() * 3).toFixed(2) + "s";
      scene.appendChild(dot);
    }

    /* ---------- Falling stars that follow the mouse ---------- */
    var canvas = document.getElementById("lgStars");
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    var particles = [];
    var colors = ["#ffffff", "#ffe9a6", "#9fd3ff", "#c9b5ff", "#ffd1e8"];
    var lastX = null;
    var lastY = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function spawn(x, y, count, burst) {
      for (var n = 0; n < count; n++) {
        var life = 55 + Math.random() * 45;
        particles.push({
          x: x + (Math.random() - 0.5) * 8,
          y: y + (Math.random() - 0.5) * 8,
          vx: (Math.random() - 0.5) * (burst ? 5 : 1.6),
          vy: (Math.random() - 0.7) * (burst ? 4 : 1.2),
          size: 3 + Math.random() * 5,
          rot: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.12,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: life,
          max: life
        });
      }
      if (particles.length > 260) {
        particles.splice(0, particles.length - 260);
      }
    }

    function starPath(cx, cy, outer, inner, rot) {
      var step = Math.PI / 5;
      var angle = rot - Math.PI / 2;
      ctx.beginPath();
      for (var k = 0; k < 10; k++) {
        var radius = (k % 2 === 0) ? outer : inner;
        ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
        angle += step;
      }
      ctx.closePath();
    }

    function animate() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (var p = particles.length - 1; p >= 0; p--) {
        var s = particles[p];
        s.vy += 0.07;          /* gravity, so the stars fall */
        s.vx *= 0.99;
        s.x += s.vx;
        s.y += s.vy;
        s.rot += s.spin;
        s.life -= 1;

        if (s.life <= 0 || s.y > window.innerHeight + 20) {
          particles.splice(p, 1);
          continue;
        }

        ctx.globalAlpha = Math.max(s.life / s.max, 0);
        ctx.fillStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 12;
        starPath(s.x, s.y, s.size, s.size * 0.45, s.rot);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      requestAnimationFrame(animate);
    }

    if (!reduceMotion) {
      animate();

      window.addEventListener("mousemove", function (event) {
        if (lastX === null || Math.abs(event.clientX - lastX) + Math.abs(event.clientY - lastY) > 7) {
          spawn(event.clientX, event.clientY, 2, false);
          lastX = event.clientX;
          lastY = event.clientY;
        }
      });

      window.addEventListener("touchmove", function (event) {
        var t = event.touches[0];
        if (t) { spawn(t.clientX, t.clientY, 2, false); }
      }, { passive: true });

      /* A bigger burst when the mouse is clicked */
      window.addEventListener("mousedown", function (event) {
        spawn(event.clientX, event.clientY, 16, true);
      });
    }

    /* ---------- Gentle 3D tilt of the card ---------- */
    var tilt = document.getElementById("lgTilt");
    if (!reduceMotion && window.matchMedia && window.matchMedia("(hover: hover)").matches) {
      scene.addEventListener("mousemove", function (event) {
        var rect = tilt.getBoundingClientRect();
        var dx = (event.clientX - (rect.left + rect.width / 2)) / window.innerWidth;
        var dy = (event.clientY - (rect.top + rect.height / 2)) / window.innerHeight;
        tilt.style.transform = "rotateX(" + (-dy * 10).toFixed(2) + "deg) rotateY(" + (dx * 12).toFixed(2) + "deg)";
      });
      scene.addEventListener("mouseleave", function () {
        tilt.style.transform = "rotateX(0deg) rotateY(0deg)";
      });
    }

    /* ---------- Show or hide password ---------- */
    var password = document.getElementById("loginPassword");
    var toggle = document.getElementById("lgToggle");
    var toggleIcon = document.getElementById("lgToggleIcon");
    var caps = document.getElementById("lgCaps");

    toggle.addEventListener("click", function () {
      var hidden = password.type === "password";
      password.type = hidden ? "text" : "password";
      toggleIcon.className = hidden ? "fas fa-eye-slash" : "fas fa-eye";
    });

    /* ---------- Caps Lock warning ---------- */
    password.addEventListener("keyup", function (event) {
      if (event.getModifierState) {
        caps.style.display = event.getModifierState("CapsLock") ? "block" : "none";
      }
    });
    password.addEventListener("blur", function () {
      caps.style.display = "none";
    });

    /* ---------- Button ripple and loading state ---------- */
    var form = document.getElementById("loginForm");
    var button = document.getElementById("lgButton");

    button.addEventListener("click", function (event) {
      var rect = button.getBoundingClientRect();
      var ripple = document.createElement("span");
      var size = Math.max(rect.width, rect.height);
      ripple.className = "lg-ripple";
      ripple.style.width = size + "px";
      ripple.style.height = size + "px";
      ripple.style.left = (event.clientX - rect.left - size / 2) + "px";
      ripple.style.top = (event.clientY - rect.top - size / 2) + "px";
      button.appendChild(ripple);
      setTimeout(function () { ripple.remove(); }, 650);
    });

    form.addEventListener("submit", function () {
      button.disabled = true;
      button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
    });

    /* If the browser comes back with the Back button, reset the button */
    window.addEventListener("pageshow", function () {
      button.disabled = false;
      button.innerHTML = "Sign In";
    });
  })();
</script>

{% endblock %}
